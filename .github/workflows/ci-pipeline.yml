name: Run CI Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.head.ref }}-${{ github.workflow }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  PIP_VERSION: "26.1.1"

jobs:
  ############################
  # Linting and Formatting
  ############################
  lint:
    name: Linting and Formatting
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      
      - name: Upgrade pip
        run: python -m pip install --upgrade pip==${{ env.PIP_VERSION }}

      - name: Install Dev Dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Ruff Lint
        run: python -m ruff check src --output-format=github

      - name: Ruff Format
        run: python -m ruff format src --check --diff


  ########################
  # Security Scans
  ########################
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip==${{ env.PIP_VERSION }}

      - name: Install Dev Dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Show Python and pip versions
        run: |
          python --version
          python -m pip --version
          python -m pip list | grep pip

      - name: Run pip-audit
        run: python -m pip_audit --ignore-vuln GHSA-4xh5-x5gv-qwph

      - name: Run Bandit
        run: python -m bandit -r . --exclude ./tests

  ########################
  # Type Checking
  ########################
  type-check:
    name: Type Checking
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip==${{ env.PIP_VERSION }}

      - name: Install Dev Dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run mypy
        run: python -m mypy --explicit-package-bases src
